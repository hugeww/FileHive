# =============================================================================
# FileHive Docker Compose - 生产环境标准版（环境变量全部来自 .env）
# 版本在 .env 的 FILEHIVE_IMAGE 中控制
#
# 用法:
#   docker compose up -d
#   docker compose logs -f filehive
# =============================================================================

services:
  filehive:
    image: ${FILEHIVE_IMAGE:-ghcr.io/hugeww/filehive:latest}
    container_name: filehive
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    ports:
      # 宿主机端口由 .env 的 SERVER_PORT / BIND_HOST 控制；容器内固定监听 12345
      - "${BIND_HOST:-0.0.0.0}:${SERVER_PORT:-12345}:12345"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Docker 命名卷（生产推荐，Docker 统一托管，数据保存在 /var/lib/docker/volumes/）
      - filehive_data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:12345/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  filehive_data:
