name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: filehive-linux-x86_64
            binary_name: filehive
            archive_ext: tar.gz
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: filehive-windows-x86_64
            binary_name: filehive.exe
            archive_ext: zip
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            name: filehive-macos-aarch64
            binary_name: filehive
            archive_ext: tar.gz
          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            name: filehive-macos-x86_64
            binary_name: filehive
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Build frontend themes
        run: |
          cd frontend
          pnpm install --frozen-lockfile --prod=false
          pnpm run build-only --outDir ../themes/2024

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release -p filehive-server --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          DIST_DIR="${{ matrix.name }}"
          mkdir -p "$DIST_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$DIST_DIR/"
          cp -r themes "$DIST_DIR/"
          cp README.md LICENSE "$DIST_DIR/"
          tar -czvf "${{ matrix.name }}.tar.gz" "$DIST_DIR"

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dist = "${{ matrix.name }}"
          New-Item -ItemType Directory -Path $dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $dist
          Copy-Item -Recurse themes -Destination $dist
          Copy-Item README.md, LICENSE -Destination $dist
          Compress-Archive -Path $dist -DestinationPath "${{ matrix.name }}.zip"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.name }}.${{ matrix.archive_ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
