[workspace]
members = [
    "crates/fcb-core",
    "crates/fcb-storage",
    "crates/fcb-db",
    "crates/fcb-security",
    "crates/fcb-config",
    "crates/fcb-server",
]
resolver = "2"

[workspace.package]
version = "2.8.2"
edition = "2021"
authors = ["Lan <xzu@live.com>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
sqlx = { version = "0.8", features = ["sqlite", "postgres", "mysql", "runtime-tokio", "tls-rustls", "chrono"] }
opendal = { version = "0.51", features = ["services-fs", "services-s3", "services-webdav", "services-onedrive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1.7"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1.11", features = ["v4", "fast-rng"] }
scrypt = "0.11"
jsonwebtoken = "9.3"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
ipnet = "2.10"
url = "2.5"
mime_guess = "2.0"
async-trait = "0.1"
thiserror = "2.0"
anyhow = "1.0"
bytes = "1.9"
futures = "0.3"
futures-util = "0.3"
regex = "1.11"
subtle = "2.6"
percent-encoding = "2.3"
base64 = "0.22"
rust-embed = "8.5"
http = "1.2"

fcb-core = { path = "crates/fcb-core" }
fcb-storage = { path = "crates/fcb-storage" }
fcb-db = { path = "crates/fcb-db" }
fcb-security = { path = "crates/fcb-security" }
fcb-config = { path = "crates/fcb-config" }
